 [project]
 name = "school-pos-backend"
 version = "0.1.0"
 description = "School POS backend (FastAPI + SQL Server)"
 requires-python = ">=3.11"
 dependencies = [
   "fastapi>=0.115",
   "uvicorn[standard]>=0.30",
   "pydantic>=2.7",
   "pydantic-settings>=2.3",
   "sqlalchemy[asyncio]>=2.0.30",
   "alembic>=1.13",
   "aioodbc>=0.5.0",
   "pyodbc>=5.1.0",
   "python-jose[cryptography]>=3.3.0",
   "passlib[bcrypt]>=1.7.4",
   "python-multipart>=0.0.9",
   "orjson>=3.10.6",
   "tenacity>=8.3.0",
   "httpx>=0.27.0",
   "pytest>=8.2.0",
   "pytest-asyncio>=0.23.7",
   "rich>=13.7.1",
 ]
 
 [tool.pytest.ini_options]
 asyncio_mode = "auto"
 testpaths = ["tests"]
 
